name: Build exam sheet PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: exam-sheet-pdf
          path: main.pdf
          retention-days: 90
